name: VortexDM Core CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  VCPKG_BINARY_SOURCES: default,readwrite
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build clang
      - uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: "93ad765c7b66ab9ce97469ec23a90b15c3a14ee5"
          path: vcpkg
          persist-credentials: false
      - name: Bootstrap vcpkg
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-cache"
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          path: .vcpkg-cache
          key: Linux-${{ matrix.compiler }}-vcpkg-x64-linux-release-${{ hashFiles('vcpkg.json') }}
          restore-keys: Linux-${{ matrix.compiler }}-vcpkg-x64-linux-release-
      - name: Configure core
        run: |
          cmake -S . -B build/core -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-release \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/triplets" \
            -DVORTEX_BUILD_TESTS=ON -DVORTEX_BUILD_UI=OFF
      - run: cmake --build build/core --parallel 2
      - run: ctest --test-dir build/core --output-on-failure
  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
          }
          ninja --version
      - uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: "93ad765c7b66ab9ce97469ec23a90b15c3a14ee5"
          path: vcpkg
          persist-credentials: false
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\.vcpkg-cache" | Out-Null
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE\.vcpkg-cache" >> $env:GITHUB_ENV
      - uses: actions/cache@v5
        with:
          path: .vcpkg-cache
          key: Windows-MSVC-vcpkg-x64-windows-release-${{ hashFiles('vcpkg.json') }}
          restore-keys: Windows-MSVC-vcpkg-x64-windows-release-
      - name: Configure core with MSVC
        shell: pwsh
        run: cmake -S . -B build/core -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-release "-DVCPKG_OVERLAY_TRIPLETS=$env:GITHUB_WORKSPACE/triplets" -DVORTEX_BUILD_TESTS=ON -DVORTEX_BUILD_UI=OFF
      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build/core --parallel 2
          ctest --test-dir build/core --output-on-failure
