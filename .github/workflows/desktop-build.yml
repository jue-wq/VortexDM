name: VortexDM Desktop Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
env:
  VCPKG_BINARY_SOURCES: default,readwrite
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt-host: linux
            qt-arch: linux_gcc_64
            artifact: vortexdm-linux-x64
            qt-archives: qtbase qtdeclarative qtshadertools icu
          - os: windows-latest
            qt-host: windows
            qt-arch: win64_msvc2022_64
            artifact: vortexdm-windows-x64
            qt-archives: qtbase qtdeclarative qtshadertools
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - name: Enable MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
          }
      - uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: "93ad765c7b66ab9ce97469ec23a90b15c3a14ee5"
          path: vcpkg
          persist-credentials: false
      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\.vcpkg-cache" | Out-Null
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE\.vcpkg-cache" >> $env:GITHUB_ENV
      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-cache"
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          path: .vcpkg-cache
          key: ${{ runner.os }}-vcpkg-release-${{ hashFiles('vcpkg.json') }}
          restore-keys: ${{ runner.os }}-vcpkg-release-
      - uses: lukka/get-cmake@latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          dir: ${{ runner.temp }}
          archives: ${{ matrix.qt-archives }}
          cache: true
      - name: Configure desktop UI (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cmake -S . -B build/desktop -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-release \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/triplets" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DVORTEX_BUILD_UI=ON -DVORTEX_BUILD_TESTS=OFF
      - name: Configure desktop UI (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build/desktop -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-release "-DVCPKG_OVERLAY_TRIPLETS=$env:GITHUB_WORKSPACE/triplets" "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DVORTEX_BUILD_UI=ON -DVORTEX_BUILD_TESTS=OFF
      - name: Build desktop UI
        run: cmake --build build/desktop --target vortexdm --parallel 2
      - name: Bundle Linux runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          stage="$RUNNER_TEMP/vortexdm-linux"
          cmake --install build/desktop --prefix "$stage"
          test -x "$stage/bin/vortexdm"
          tar -C "$stage" -czf "$GITHUB_WORKSPACE/vortexdm-linux-x64.tar.gz" .
      - name: Bundle Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "$env:GITHUB_WORKSPACE\dist\windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\build\desktop\vortexdm.exe" $stage
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --qmldir "$env:GITHUB_WORKSPACE\src\ui" --release --compiler-runtime "$stage\vortexdm.exe"
          $vcpkgBin = "$env:GITHUB_WORKSPACE\build\desktop\vcpkg_installed\x64-windows-release\bin"
          if (-not (Test-Path $vcpkgBin)) { throw "vcpkg runtime DLL directory missing" }
          Get-ChildItem $vcpkgBin -Filter *.dll | Copy-Item -Destination $stage -Force
          $required = @("libcurl.dll","sqlite3.dll","libcrypto*.dll","libssl*.dll","tinyxml2.dll")
          foreach ($pattern in $required) {
            if (-not (Get-ChildItem $stage -Filter $pattern -Recurse)) { throw "Required runtime DLL missing: $pattern" }
          }
          Compress-Archive -Path "$stage\*" -DestinationPath "$env:GITHUB_WORKSPACE\vortexdm-windows-x64.zip" -Force
      - name: Upload Linux executable package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: vortexdm-linux-x64
          if-no-files-found: error
          retention-days: 30
          path: vortexdm-linux-x64.tar.gz
      - name: Upload Windows executable package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: vortexdm-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: vortexdm-windows-x64.zip
  publish-release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          else
            tag="nightly"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "VortexDM Nightly" --target "$GITHUB_SHA" --prerelease --generate-notes
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" release-assets/vortexdm-linux-x64.tar.gz release-assets/vortexdm-windows-x64.zip --clobber
