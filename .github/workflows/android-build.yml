name: VortexDM Android Build
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - "src/core/**"
      - "src/ui/**"
      - "src/ipc/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "triplets/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
env:
  VCPKG_BINARY_SOURCES: default,readwrite
jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Ninja and CMake
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build
      - uses: lukka/get-cmake@latest
      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          sdkmanager="$(find "$sdk/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -n "$sdkmanager" || { echo "sdkmanager not found"; exit 1; }
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$sdk/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$sdk/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: "93ad765c7b66ab9ce97469ec23a90b15c3a14ee5"
          path: vcpkg
          persist-credentials: false
      - name: Bootstrap vcpkg
        shell: bash
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-cache"
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          path: .vcpkg-cache
          key: ubuntu-vcpkg-arm64-android-release-${{ hashFiles('vcpkg.json') }}
          restore-keys: ubuntu-vcpkg-arm64-android-release-
      - name: Install Qt Android target
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: all_os
          target: android
          arch: android_arm64_v8a
          dir: ${{ runner.temp }}
          archives: qtbase qtdeclarative qtshadertools
          cache: true
      - name: Install matching Qt host tools
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}
          archives: qtbase qtdeclarative qtshadertools
          cache: true
      - name: Set consistent Qt roots
        shell: bash
        run: |
          qt_root="$RUNNER_TEMP/Qt/6.8.3"
          test -d "$qt_root/android_arm64_v8a"
          test -d "$qt_root/gcc_64"
          find "$qt_root/gcc_64/lib/cmake" -name Qt6ShaderToolsToolsConfig.cmake -print -quit | grep -q . || { echo "Qt host ShaderTools tools config missing" >&2; exit 1; }
          {
            echo "QT_ANDROID_ROOT=$qt_root/android_arm64_v8a"
            echo "QT_HOST_PATH=$qt_root/gcc_64"
            clean_ld_path="$qt_root/gcc_64/lib"
            IFS=':' read -r -a qt_ld_parts <<< "${LD_LIBRARY_PATH:-}"
            for path in "${qt_ld_parts[@]}"; do
              if [[ -n "$path" && "$path" != "$qt_root/android_arm64_v8a/lib" && "$path" != "$qt_root/gcc_64/lib" ]]; then
                clean_ld_path="$clean_ld_path:$path"
              fi
            done
            echo "LD_LIBRARY_PATH=$clean_ld_path"
          } >> "$GITHUB_ENV"
      - name: Create temporary CI signing key
        shell: bash
        run: |
          key="$RUNNER_TEMP/vortexdm-ci.keystore"
          keytool -genkeypair -v -keystore "$key" -storepass "vortexdm-ci-only" -alias vortexdm-ci -keypass "vortexdm-ci-only" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VortexDM CI,O=VortexDM,C=US"
          {
            echo "QT_ANDROID_KEYSTORE_PATH=$key"
            echo "QT_ANDROID_KEYSTORE_ALIAS=vortexdm-ci"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=vortexdm-ci-only"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=vortexdm-ci-only"
          } >> "$GITHUB_ENV"
      - name: Configure Qt Android application
        shell: bash
        run: |
          if cmake --preset android-arm64 \
            -DVORTEX_BUILD_UI=ON -DVORTEX_BUILD_TESTS=OFF \
            -DVCPKG_TARGET_TRIPLET=arm64-android-release \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/triplets" \
            -DQT_ANDROID_ROOT="$QT_ANDROID_ROOT" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DCMAKE_PREFIX_PATH="$QT_ANDROID_ROOT" \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DQT_DEBUG_FIND_PACKAGE=ON \
            -DQT_ANDROID_SIGN_APK:BOOL=ON -DQT_ANDROID_SIGN_AAB:BOOL=ON; then
            echo "Android Qt configure succeeded"
          else
            echo "=== EGL/GLES package cache ==="
            grep -E '^(EGL_LIBRARY|EGL_INCLUDE_DIR|GLESv2_LIBRARY|GLESv2_INCLUDE_DIR|HAVE_EGL|HAVE_GLESv2|CMAKE_SYSROOT|CMAKE_FIND_ROOT_PATH|CMAKE_SYSTEM_LIBRARY_PATH|ANDROID_NDK|ANDROID_PLATFORM):' build/android-arm64/CMakeCache.txt || true
            echo "=== EGL/GLES configure checks ==="
            grep -n -A45 -B4 -E 'HAVE_EGL|HAVE_GLESv2' build/android-arm64/CMakeFiles/CMakeConfigureLog.yaml | tail -n 360 || true
            exit 1
          fi
      - name: Build standalone APK and AAB
        run: |
          cmake --build --preset android-arm64 --target apk --parallel 2
          cmake --build --preset android-arm64 --target aab --parallel 2
      - name: Validate and collect Android packages
        shell: bash
        run: |
          mkdir -p release-assets
          apk="$(find build/android-arm64 -type f -name '*.apk' -print -quit)"
          aab="$(find build/android-arm64 -type f -name '*.aab' -print -quit)"
          test -n "$apk" && test -n "$aab"
          cp "$apk" release-assets/vortexdm-android-arm64.apk
          cp "$aab" release-assets/vortexdm-android-arm64.aab
          unzip -t release-assets/vortexdm-android-arm64.apk
          unzip -l release-assets/vortexdm-android-arm64.apk | grep -E 'lib/arm64-v8a/.*\.so'
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose release-assets/vortexdm-android-arm64.apk
          unzip -t release-assets/vortexdm-android-arm64.aab
          jarsigner -verify release-assets/vortexdm-android-arm64.aab
      - uses: actions/upload-artifact@v6
        with:
          name: vortexdm-android-arm64-apk
          if-no-files-found: error
          retention-days: 30
          path: release-assets/vortexdm-android-arm64.apk
      - uses: actions/upload-artifact@v6
        with:
          name: vortexdm-android-arm64-aab
          if-no-files-found: error
          retention-days: 30
          path: release-assets/vortexdm-android-arm64.aab
  publish-release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [android-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish Android packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          else
            tag="nightly"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "VortexDM Nightly" --target "$GITHUB_SHA" --prerelease --generate-notes
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" release-assets/vortexdm-android-arm64.apk release-assets/vortexdm-android-arm64.aab --clobber
