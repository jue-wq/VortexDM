name: VortexDM CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_progress.py
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "93ad765c7b66ab9ce97469ec23a90b15c3a14ee5"
      - uses: lukka/run-cmake@v10
        with:
          configurePreset: default
          buildPreset: default
          testPreset: default
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-35"
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "93ad765c7b66ab9ce97469ec23a90b15c3a14ee5"
      - name: Configure Android arm64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          cmake --preset android-arm64
      - name: Build Android core
        run: cmake --build --preset android-arm64 --parallel 2
