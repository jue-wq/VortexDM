name: VortexDM CI
on:
  push:
  pull_request:
  workflow_dispatch:

# New commits supersede stale builds on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_progress.py
  desktop-build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "93ad765c7b66ab9ce97469ec23a90b15c3a14ee5"
      - uses: lukka/run-cmake@v10
        with:
          configurePreset: default
          buildPreset: default
          testPreset: default
      - name: Upload desktop build outputs
        uses: actions/upload-artifact@v4
        with:
          name: vortexdm-desktop-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/desktop/vortex-cli*
            build/desktop/vortex-native-host*
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $SDK"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "93ad765c7b66ab9ce97469ec23a90b15c3a14ee5"
      - name: Configure Android arm64
        run: cmake --preset android-arm64
      - name: Build Android core
        run: cmake --build --preset android-arm64 --parallel 2
      - name: Upload Android ARM64 core libraries
        uses: actions/upload-artifact@v4
        with:
          name: vortexdm-android-arm64-core
          if-no-files-found: error
          retention-days: 30
          path: build/android-arm64/libvortex_core.a
  android-app:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: android
          arch: android_arm64_v8a
          cache: true
      - name: Configure Android SDK and Qt-compatible NDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $SDK"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$SDK/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "93ad765c7b66ab9ce97469ec23a90b15c3a14ee5"
      - name: Configure Qt Android application
        run: cmake --preset android-arm64 -DVORTEX_BUILD_UI=ON -DVORTEX_BUILD_TESTS=OFF
      - name: Build installable Android APK
        run: cmake --build --preset android-arm64 --target vortexdm_make_apk --parallel 2
      - name: Build Android App Bundle
        run: cmake --build --preset android-arm64 --target vortexdm_make_aab --parallel 2
      - name: Collect standalone APK and AAB
        shell: bash
        run: |
          mkdir -p release-assets/android
          APK="$(find build/android-arm64 -type f -name '*.apk' -print -quit)"
          AAB="$(find build/android-arm64 -type f -name '*.aab' -print -quit)"
          if [ -z "$APK" ] || [ -z "$AAB" ]; then
            echo "Qt did not produce both APK and AAB packages."
            find build/android-arm64 -maxdepth 7 -type f | sort | tail -n 100
            exit 1
          fi
          cp "$APK" release-assets/android/vortexdm-android-arm64.apk
          cp "$AAB" release-assets/android/vortexdm-android-arm64.aab
          test -s release-assets/android/vortexdm-android-arm64.apk
          test -s release-assets/android/vortexdm-android-arm64.aab
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose release-assets/android/vortexdm-android-arm64.apk
          unzip -t release-assets/android/vortexdm-android-arm64.aab
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: vortexdm-android-arm64-apk
          if-no-files-found: error
          retention-days: 30
          path: release-assets/android/vortexdm-android-arm64.apk
      - name: Upload standalone AAB
        uses: actions/upload-artifact@v4
        with:
          name: vortexdm-android-arm64-aab
          if-no-files-found: error
          retention-days: 30
          path: release-assets/android/vortexdm-android-arm64.aab
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "93ad765c7b66ab9ce97469ec23a90b15c3a14ee5"
      - name: Configure ASan and UBSan
        if: matrix.sanitizer == 'asan-ubsan'
        run: cmake -S . -B build/asan -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Debug -DVORTEX_ENABLE_ASAN_UBSAN=ON
      - name: Configure TSan
        if: matrix.sanitizer == 'tsan'
        run: cmake -S . -B build/tsan -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Debug -DVORTEX_ENABLE_TSAN=ON
      - name: Build sanitizer target
        run: |
          if [ "${{ matrix.sanitizer }}" = "asan-ubsan" ]; then cmake --build build/asan --parallel 2; else cmake --build build/tsan --parallel 2; fi
      - name: Run sanitizer tests
        run: |
          if [ "${{ matrix.sanitizer }}" = "asan-ubsan" ]; then ctest --test-dir build/asan --output-on-failure; else TSAN_OPTIONS="halt_on_error=1" ctest --test-dir build/tsan --output-on-failure; fi
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [checkpoint, desktop-build, android-arm64, android-app, sanitizers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux desktop executables
        uses: actions/download-artifact@v4
        with:
          name: vortexdm-desktop-ubuntu-latest
          path: release-assets/linux
      - name: Download Windows desktop executables
        uses: actions/download-artifact@v4
        with:
          name: vortexdm-desktop-windows-latest
          path: release-assets/windows
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: vortexdm-android-arm64-apk
          path: release-assets/android
      - name: Download Android App Bundle
        uses: actions/download-artifact@v4
        with:
          name: vortexdm-android-arm64-aab
          path: release-assets/android
      - name: Publish individual build files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'VortexDM Nightly' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: false
          target_commitish: main
          files: |
            release-assets/linux/*
            release-assets/windows/*
            release-assets/android/*.apk
            release-assets/android/*.aab
          generate_release_notes: true
