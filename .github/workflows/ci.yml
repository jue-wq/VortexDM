name: VortexDM CI
on:
  push:
  pull_request:
  workflow_dispatch:

# New commits supersede stale builds on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  VCPKG_BINARY_SOURCES: default,readwrite
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/check_progress.py
  desktop-build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Ensure Ninja is available
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              choco install ninja --yes --no-progress
            else
              sudo apt-get update -qq
              sudo apt-get install -y ninja-build
            fi
          fi
          ninja --version
      - name: Checkout pinned vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: "93ad765c7b66ab9ce97469ec23a90b15c3a14ee5"
          path: vcpkg
          persist-credentials: false
      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VcpkgPath = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          & (Join-Path $VcpkgPath 'bootstrap-vcpkg.bat') -disableMetrics
          $BinaryCache = Join-Path $env:GITHUB_WORKSPACE '.vcpkg-cache'
          New-Item -ItemType Directory -Force -Path $BinaryCache | Out-Null
          "VCPKG_ROOT=$VcpkgPath" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$BinaryCache" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE '.vcpkg-cache') | Out-Null
      - name: Bootstrap vcpkg on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-cache"
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-cache" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-cache"
      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: .vcpkg-cache
          key: ${{ runner.os }}-vcpkg-desktop-mingw-triplet-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-desktop-
      - name: Ensure vcpkg binary cache exists on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Ensure vcpkg binary cache exists on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Select MinGW-compatible vcpkg triplet
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "VCPKG_DEFAULT_TRIPLET=x64-mingw-static" >> $env:GITHUB_ENV
      - name: Configure desktop build
        run: cmake --preset default
      - name: Build desktop application
        run: cmake --build --preset default --parallel 2
      - name: Run desktop tests
        run: ctest --preset default --output-on-failure
      - name: Upload desktop build outputs
        uses: actions/upload-artifact@v6
        with:
          name: vortexdm-desktop-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/desktop/vortex-cli*
            build/desktop/vortex-native-host*
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Ensure Ninja is available
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              choco install ninja --yes --no-progress
            else
              sudo apt-get update -qq
              sudo apt-get install -y ninja-build
            fi
          fi
          ninja --version
      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $SDK"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Checkout pinned vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: "93ad765c7b66ab9ce97469ec23a90b15c3a14ee5"
          path: vcpkg
          persist-credentials: false
      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VcpkgPath = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          & (Join-Path $VcpkgPath 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$VcpkgPath" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$(Join-Path $env:GITHUB_WORKSPACE '.vcpkg-cache')" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE '.vcpkg-cache') | Out-Null
      - name: Bootstrap vcpkg on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-cache" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-cache"
      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: .vcpkg-cache
          key: ubuntu-vcpkg-arm64-android-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ubuntu-vcpkg-arm64-android-
      - name: Ensure vcpkg binary cache exists on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Ensure vcpkg binary cache exists on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Configure Android arm64
        run: cmake --preset android-arm64
      - name: Build Android core
        run: cmake --build --preset android-arm64 --parallel 2
      # Core libraries are internal build products, not user-facing downloads.
  android-app:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Ensure Ninja is available
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              choco install ninja --yes --no-progress
            else
              sudo apt-get update -qq
              sudo apt-get install -y ninja-build
            fi
          fi
          ninja --version
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: all_os
          target: android
          arch: android_arm64_v8a
          archives: qtbase qtdeclarative qtshadertools
          cache: true
      - name: Preserve Android Qt package root
        shell: bash
        run: |
          echo "QT_ANDROID_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$QT_HOST_PATH/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Install matching Qt host tools
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ github.workspace }}
          archives: qtbase qtdeclarative qtshadertools
          cache: true
      - name: Configure Qt host tool runtime
        shell: bash
        run: |
          echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$QT_ROOT_DIR/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "Android Qt root: $QT_ANDROID_ROOT"
          echo "Qt host root: $QT_ROOT_DIR"
          find "$QT_ANDROID_ROOT/lib/cmake" -maxdepth 2 -type f \( -name 'Qt6QuickConfig.cmake' -o -name 'Qt6QmlConfig.cmake' \) -print
          find "$QT_ROOT_DIR/lib/cmake" -maxdepth 2 -type f \( -name 'Qt6QmlToolsConfig.cmake' -o -name 'Qt6QuickToolsConfig.cmake' \) -print
      - name: Configure Android SDK and Qt-compatible NDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $SDK"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$SDK/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - name: Create ephemeral CI signing key
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/vortexdm-ci.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass "vortexdm-ci-only" -alias vortexdm-ci -keypass "vortexdm-ci-only" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VortexDM CI,O=VortexDM,C=US"
          {
            echo "QT_ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "QT_ANDROID_KEYSTORE_ALIAS=vortexdm-ci"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=vortexdm-ci-only"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=vortexdm-ci-only"
          } >> "$GITHUB_ENV"
      - name: Checkout pinned vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: "93ad765c7b66ab9ce97469ec23a90b15c3a14ee5"
          path: vcpkg
          persist-credentials: false
      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\\vcpkg\\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\\vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE\\.vcpkg-cache" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE '.vcpkg-cache') | Out-Null
      - name: Bootstrap vcpkg on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-cache" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-cache"
      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: .vcpkg-cache
          key: ${{ 'ubuntu-vcpkg-arm64-android' }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ 'ubuntu-vcpkg-arm64-android' }}-
      - name: Ensure vcpkg binary cache exists on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Ensure vcpkg binary cache exists on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Configure Qt Android application
        run: cmake --preset android-arm64 -DVORTEX_BUILD_UI=ON -DVORTEX_BUILD_TESTS=OFF -DQt6_DIR="$QT_ANDROID_ROOT/lib/cmake/Qt6" -DQt6Quick_DIR="$QT_ANDROID_ROOT/lib/cmake/Qt6Quick" -DQt6Qml_DIR="$QT_ANDROID_ROOT/lib/cmake/Qt6Qml" -DQt6Network_DIR="$QT_ANDROID_ROOT/lib/cmake/Qt6Network" -DQT_HOST_PATH="$QT_ROOT_DIR" -DQT_ANDROID_SIGN_APK:BOOL=ON -DQT_ANDROID_SIGN_AAB:BOOL=ON --debug-find-pkg=Qt6Quick
      - name: Build installable Android APK
        run: cmake --build --preset android-arm64 --target apk --parallel 2
      - name: Build Android App Bundle
        run: cmake --build --preset android-arm64 --target aab --parallel 2
      - name: Collect standalone APK and AAB
        shell: bash
        run: |
          mkdir -p release-assets/android
          APK="$(find build/android-arm64 -type f -name '*.apk' -print -quit)"
          AAB="$(find build/android-arm64 -type f -name '*.aab' -print -quit)"
          if [ -z "$APK" ] || [ -z "$AAB" ]; then
            echo "Qt did not produce both APK and AAB packages."
            find build/android-arm64 -maxdepth 7 -type f | sort | tail -n 100
            exit 1
          fi
          cp "$APK" release-assets/android/vortexdm-android-arm64.apk
          cp "$AAB" release-assets/android/vortexdm-android-arm64.aab
          test -s release-assets/android/vortexdm-android-arm64.apk
          test -s release-assets/android/vortexdm-android-arm64.aab
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose release-assets/android/vortexdm-android-arm64.apk
          unzip -t release-assets/android/vortexdm-android-arm64.aab
          jarsigner -verify release-assets/android/vortexdm-android-arm64.aab
      - name: Upload standalone APK
        uses: actions/upload-artifact@v6
        with:
          name: vortexdm-android-arm64-apk
          if-no-files-found: error
          retention-days: 30
          path: release-assets/android/vortexdm-android-arm64.apk
      - name: Upload standalone AAB
        uses: actions/upload-artifact@v6
        with:
          name: vortexdm-android-arm64-aab
          if-no-files-found: error
          retention-days: 30
          path: release-assets/android/vortexdm-android-arm64.aab
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@v5
      - name: Ensure Ninja is available
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              choco install ninja --yes --no-progress
            else
              sudo apt-get update -qq
              sudo apt-get install -y ninja-build
            fi
          fi
          ninja --version
      - name: Checkout pinned vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: "93ad765c7b66ab9ce97469ec23a90b15c3a14ee5"
          path: vcpkg
          persist-credentials: false
      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\\vcpkg\\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\\vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE\\.vcpkg-cache" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE '.vcpkg-cache') | Out-Null
      - name: Bootstrap vcpkg on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-cache" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-cache"
      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: .vcpkg-cache
          key: ubuntu-vcpkg-x64-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ubuntu-vcpkg-x64-linux-
      - name: Ensure vcpkg binary cache exists on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Ensure vcpkg binary cache exists on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Configure ASan and UBSan
        if: matrix.sanitizer == 'asan-ubsan'
        run: cmake -S . -B build/asan -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Debug -DVORTEX_ENABLE_ASAN_UBSAN=ON
      - name: Configure TSan
        if: matrix.sanitizer == 'tsan'
        run: cmake -S . -B build/tsan -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Debug -DVORTEX_ENABLE_TSAN=ON
      - name: Build sanitizer target
        run: |
          if [ "${{ matrix.sanitizer }}" = "asan-ubsan" ]; then cmake --build build/asan --parallel 2; else cmake --build build/tsan --parallel 2; fi
      - name: Run sanitizer tests
        run: |
          if [ "${{ matrix.sanitizer }}" = "asan-ubsan" ]; then ctest --test-dir build/asan --output-on-failure; else TSAN_OPTIONS="halt_on_error=1" ctest --test-dir build/tsan --output-on-failure; fi
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [checkpoint, desktop-build, android-arm64, android-app, sanitizers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download individual build files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/linux release-assets/windows release-assets/android
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name vortexdm-desktop-ubuntu-latest --dir release-assets/linux
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name vortexdm-desktop-windows-latest --dir release-assets/windows
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name vortexdm-android-arm64-apk --dir release-assets/android
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name vortexdm-android-arm64-aab --dir release-assets/android
          test -n "$(find release-assets/linux -type f -print -quit)"
          test -n "$(find release-assets/windows -type f -print -quit)"
          test -s release-assets/android/vortexdm-android-arm64.apk
          test -s release-assets/android/vortexdm-android-arm64.aab
      - name: Publish individual build files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            TITLE="$GITHUB_REF_NAME"
            PRERELEASE=()
          else
            TAG="nightly"
            TITLE="VortexDM Nightly"
            PRERELEASE=(--prerelease)
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --target main --generate-notes "${PRERELEASE[@]}"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            release-assets/linux/* release-assets/windows/* \
            release-assets/android/vortexdm-android-arm64.apk \
            release-assets/android/vortexdm-android-arm64.aab \
            --clobber
