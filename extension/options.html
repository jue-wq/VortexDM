<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VortexDM Bridge Settings</title><link rel="stylesheet" href="popup.css"></head><body style="width:auto;max-width:560px;margin:24px auto"><header><strong>VortexDM Browser Bridge</strong></header><main><p>Desktop Firefox uses the installed Native Messaging host. Android Firefox can connect to the VortexDM app through its loopback port and one-time API key.</p><label>Android loopback port <input id="port" inputmode="numeric" placeholder="e.g. 43123"></label><p><label>One-time API key <input id="key" type="password" style="width:270px"></label></p><button id="save">Save connection</button><p id="status"></p><p>Android ad blocking is provided by the original <a href="https://addons.mozilla.org/android/addon/ublock-origin/" target="_blank">uBlock Origin add-on</a>, not by this bridge.</p></main><script src="options.js"></script></body></html>
